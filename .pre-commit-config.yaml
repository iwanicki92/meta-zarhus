---
default_stages: [pre-commit]

default_install_hook_types: [pre-commit, commit-msg]
exclude: |
  (?x)^(
    .*\.patch|
    .*\.diff|
    .*\.ppm|
    CHANGELOG.md|
    meta-zarhus-distro/classes-recipe/.*|
    meta-zarhus-distro/recipes-devtools/rust/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-c=.yamllint]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
      - id: markdownlint-fix

  - repo: https://github.com/talos-systems/conform
    rev: v0.1.0-alpha.30
    hooks:
      - id: conform
        stages:
          - commit-msg

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  - repo: https://github.com/priv-kweihmann/oelint-adv
    rev: 9.0.1
    hooks:
      - id: oelint-adv
        args: [--rulefile=.oelint-ruleset.json, --hide=info, --quiet, --fix, --constantmods=+.oelint-custom-overrides.json]
        name: Advanced oelint
        description: Based on the OpenEmbedded Styleguide and work done by oe-stylize-tool this module offers a (nearly) complete linter for bitbake-recipes.
        entry: oelint-adv
        language: python
        language_version: python3
        files: .*\.(bb)|(bbappend)|(bbclass)$
        exclude: |
          (?x)^(
            .*/zarhus-swu-image.*\.bb
          )$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell

  - repo: https://github.com/3mdeb/hooks
    rev: v0.2.2
    hooks:
      - id: namespell
        args: [--fix]
        exclude: |
          (?x)^(
            README.md|
            .*/layer.conf|
          )$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflow files
        description: Runs actionlint to lint GitHub Actions workflow files
        language: golang
        types: ["yaml"]
        files: ^\.github/workflows/
        entry: actionlint
        minimum_pre_commit_version: 3.0.0

ci:
  autoupdate_commit_msg: 'pre-commit: autoupdate hooks'
  autoupdate_branch: develop
  autofix_prs: false
  # docker is not supported on pre-commit.ci
  skip: [shellcheck]
