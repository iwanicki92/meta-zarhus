---
header:
  version: 11

repos:
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    refspec: scarthgap

local_conf_header:
  rpi-config: |
    WKS_FILE = "sdimage-raspberrypi.wks"
    SERIAL_CONSOLE = "115200 ttyAMA0"
    RPI_EXTRA_CONFIG = "enable_uart=1"
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
